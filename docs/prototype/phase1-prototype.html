c.html\" aria-label=\"How to do {{name}}\" style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:12px 16px;border:1px solid #3A3B35;border-radius:14px;background:#1E1F1B;color:#F3F1EA\"><span style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:15px;font-weight:600\">How to do this exercise<\/span><span style=\"font-size:12px;color:#A3A197\">Full guide, video and common mistakes<\/span><\/span><span aria-hidden=\"true\" style=\"font-size:24px;color:#FF7A3D\">\u203a<\/span><\/a>\n    <div class=\"slide\" style=\"display: flex; flex-direction: column; gap: 4px\">\n      <h1 style=\"margin: 0; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 32px; line-height: 1; text-transform: uppercase\">{{name}}<\/h1>\n      <span style=\"font-size: 14px; color: #A3A197\">{{sub}}<\/span>\n    <\/div>\n\n    <sc-if value=\"{{isLift}}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display: flex; flex-direction: column; gap: 4px\">\n        <div style=\"display: grid; grid-template-columns: 26px minmax(0, 1fr) minmax(0, 1fr) 48px 40px; gap: 6px; padding: 0 2px; font-size: 11px; font-weight: 600; color: #A3A197; letter-spacing: 0.08em; text-transform: uppercase\">\n          <span style=\"text-align: center\">Set<\/span><span>kg<\/span><span>Reps<\/span><span style=\"text-align: center\">Done<\/span><span><\/span>\n        <\/div>\n        <sc-for list=\"{{sets}}\" as=\"s\" hint-placeholder-count=\"4\">\n          <div style=\"display: grid; grid-template-columns: 26px minmax(0, 1fr) minmax(0, 1fr) 48px 40px; gap: 6px; align-items: center; padding: 2px; border-radius: 12px; background: {{s.rowBg}}\">\n            <span style=\"font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 18px; text-align: center\">{{s.n}}<\/span>\n            <input type=\"number\" inputmode=\"decimal\" aria-label=\"Set {{s.n}} weight in kg\" value=\"{{s.kg}}\" onChange=\"{{s.setKg}}\" style=\"width: 100%; min-width: 0; box-sizing: border-box; height: 44px; padding: 0 10px; border-radius: 10px; border: 0; background: #1E1F1B; color: {{s.fg}}; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 20px\">\n            <input type=\"number\" inputmode=\"numeric\" aria-label=\"Set {{s.n}} reps\" value=\"{{s.reps}}\" onChange=\"{{s.setReps}}\" style=\"width: 100%; min-width: 0; box-sizing: border-box; height: 44px; padding: 0 10px; border-radius: 10px; border: 0; background: #1E1F1B; color: {{s.fg}}; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 20px\">\n            <button onClick=\"{{s.toggle}}\" aria-label=\"{{s.label}}\" aria-pressed=\"{{s.done}}\" style=\"display: flex; align-items: center; justify-content: center; width: 48px; height: 44px; border-radius: 10px; border: 1.5px solid {{s.btnBorder}}; background: {{s.btnBg}}\">\n              <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"{{s.tick}}\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg>\n            <\/button>\n            <button onClick=\"{{s.remove}}\" aria-label=\"Delete set {{s.n}}\" style=\"display: flex; align-items: center; justify-content: center; width: 40px; height: 44px; border-radius: 10px; border: 0; background: transparent\">\n              <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6B6A62\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13\"><\/path><\/svg>\n            <\/button>\n          <\/div>\n        <\/sc-for>\n        <button onClick=\"{{addSet}}\" style=\"display: flex; align-items: center; justify-content: center; gap: 6px; height: 44px; margin-top: 2px; border-radius: 12px; border: 1.5px dashed #3A3B35; background: transparent; color: #C9C7BE; font-size: 15px; font-weight: 600\">\n          <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"><\/path><\/svg>\n          Add set\n        <\/button>\n      <\/div>\n    <\/sc-if>\n\n    <sc-if value=\"{{isMove}}\" hint-placeholder-val=\"{{ false }}\">\n      <button onClick=\"{{toggleMove}}\" aria-pressed=\"{{moveDone}}\" style=\"display: flex; align-items: center; justify-content: center; gap: 10px; height: 60px; border-radius: 16px; border: 1.5px solid {{moveBorder}}; background: {{moveBg}}; color: {{moveFg}}; font-size: 18px; font-weight: 700\">\n        <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg>\n        {{moveText}}\n      <\/button>\n    <\/sc-if>\n  <\/div>\n\n  <div style=\"display: flex; gap: 8px; padding: 12px 20px 30px; border-top: 1px solid #2E2F2A; background: #131411\">\n    <button onClick=\"{{prev}}\" aria-label=\"Previous exercise\" style=\"display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 60px; height: 60px; border-radius: 16px; border: 1.5px solid #3A3B35; background: transparent; opacity: {{prevOp}}\">\n      <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#F3F1EA\" stroke-width=\"2.5\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M15 6l-6 6 6 6\"><\/path><\/svg>\n    <\/button>\n    <sc-if value=\"{{hasNext}}\" hint-placeholder-val=\"{{ true }}\">\n      <button onClick=\"{{next}}\" style=\"flex-grow: 1; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; height: 60px; padding: 0 18px; border-radius: 16px; border: 0; background: {{nextBg}}; color: {{nextFg}}; text-align: left\">\n        <span style=\"display: flex; flex-direction: column; min-width: 0\">\n          <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.75\">{{nextKicker}}<\/span>\n          <span style=\"font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis\">{{nextName}}<\/span>\n        <\/span>\n        <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" aria-hidden=\"true\" style=\"flex-shrink: 0\"><path d=\"M9 6l6 6-6 6\"><\/path><\/svg>\n      <\/button>\n    <\/sc-if>\n    <sc-if value=\"{{lastAndDone}}\" hint-placeholder-val=\"{{ false }}\">\n      <a href=\"Ph1Complete.dc.html\" style=\"flex-grow: 1; display: flex; align-items: center; justify-content: center; height: 60px; border-radius: 16px; background: {{accent}}; color: #1A0E06; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 0.04em; text-transform: uppercase\">Finish workout<\/a>\n    <\/sc-if>\n    <sc-if value=\"{{lastNotDone}}\" hint-placeholder-val=\"{{ false }}\">\n      <button onClick=\"{{askFinish}}\" style=\"flex-grow: 1; height: 60px; border-radius: 16px; border: 0; background: {{accent}}; color: #1A0E06; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 0.04em; text-transform: uppercase\">Finish workout<\/button>\n    <\/sc-if>\n  <\/div>\n\n  <sc-if value=\"{{listOpen}}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; background: rgba(8, 8, 6, 0.65)\">\n      <div class=\"sheet\" role=\"dialog\" aria-label=\"All exercises\" style=\"display: flex; flex-direction: column; gap: 12px; max-height: 700px; padding: 18px 20px 30px; border-radius: 24px 24px 0 0; background: #1E1F1B; border-top: 1px solid #3A3B35\">\n        <div style=\"display: flex; justify-content: space-between; align-items: center\">\n          <span style=\"font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 26px; text-transform: uppercase\">Today\u2019s workout<\/span>\n          <button onClick=\"{{closeList}}\" aria-label=\"Close\" style=\"display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; border: 0; background: #131411\">\n            <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#F3F1EA\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"><\/path><\/svg>\n          <\/button>\n        <\/div>\n        <div style=\"display: flex; flex-direction: column; gap: 14px; overflow-y: auto\">\n          <sc-for list=\"{{listGroups}}\" as=\"lg\" hint-placeholder-count=\"3\">\n            <div style=\"display: flex; flex-direction: column\">\n              <div style=\"display: flex; justify-content: space-between; align-items: center; padding-bottom: 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase\">\n                <span style=\"color: {{lg.color}}\">{{lg.name}}<\/span><span style=\"color: #A3A197\">{{lg.count}}<\/span>\n              <\/div>\n              <sc-for list=\"{{lg.items}}\" as=\"it\" hint-placeholder-count=\"4\">\n                <button onClick=\"{{it.go}}\" style=\"display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border: 0; border-radius: 12px; background: {{it.bg}}; color: {{it.fg}}; text-align: left; font-size: 15px; font-weight: {{it.weight}}\">\n                  <span style=\"display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; border: 2px solid {{it.ring}}; background: {{it.dot}}; box-sizing: border-box\">\n                    <sc-if value=\"{{it.done}}\" hint-placeholder-val=\"{{ false }}\">\n                      <svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#131411\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg>\n                    <\/sc-if>\n                  <\/span>\n                  <span style=\"flex-grow: 1\">{{it.name}}<\/span>\n                  <span style=\"font-size: 13px; color: #A3A197\">{{it.meta}}<\/span>\n                <\/button>\n              <\/sc-for>\n            <\/div>\n          <\/sc-for>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/sc-if>\n\n  <sc-if value=\"{{confirmOpen}}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; background: rgba(8, 8, 6, 0.65)\">\n      <div class=\"sheet\" role=\"dialog\" aria-label=\"Finish early?\" style=\"display: flex; flex-direction: column; gap: 14px; padding: 22px 20px 34px; border-radius: 24px 24px 0 0; background: #1E1F1B; border-top: 1px solid #3A3B35\">\n        <div style=\"align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #3A3B35\"><\/div>\n        <h2 style=\"margin: 0; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 30px; line-height: 1; text-transform: uppercase\">You\u2019ve still got exercises left<\/h2>\n        <p style=\"margin: 0; font-size: 16px; line-height: 1.4; color: #C9C7BE\">{{leftText}} Finish anyway? We\u2019ll save what you logged.<\/p>\n        <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px\">\n          <button onClick=\"{{closeConfirm}}\" style=\"height: 56px; border-radius: 14px; border: 0; background: {{accent}}; color: #1A0E06; font-size: 17px; font-weight: 700\">Keep going<\/button>\n          <a href=\"Ph1Complete.dc.html\" style=\"display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 14px; border: 1.5px solid #3A3B35; font-size: 17px; font-weight: 600\">Finish anyway<\/a>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/sc-if>\n<\/div>\n", "code": "\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    const mk = (n, kg, reps) => Array.from({ length: n }, () => ({ kg, reps, done: false }));\n    const mv = (sec, name, dose, tag) => ({ sec, kind: 'move', name, dose, tag, done: false });\n    const lift = (name, target, last, sets) => ({ sec: 'main', kind: 'lift', name, target, last, sets });\n    const items = [\n      mv('warm', 'Cat-cow', '10 slow reps', 'lower back'),\n      mv('warm', 'Hip flexor stretch', '30 s each side', 'desk sitting'),\n      mv('warm', 'Band pull-apart', '15 reps', 'rounded shoulders'),\n      mv('warm', 'Bodyweight squat', '10 reps', ''),\n      lift('Back squat', '4 \u00d7 8 @ 62.5 kg', 'Last time: 4 \u00d7 8 @ 60 kg', mk(4, '62.5', '8')),\n      lift('Romanian deadlift', '3 \u00d7 10 @ 50 kg', 'Last time: 3 \u00d7 10 @ 47.5 kg', mk(3, '50', '10')),\n      lift('Leg press', '3 \u00d7 12 @ 100 kg', 'Last time: 3 \u00d7 12 @ 95 kg', mk(3, '100', '12')),\n      lift('Leg curl', '3 \u00d7 12 @ 35 kg', 'Last time: 3 \u00d7 11 @ 35 kg', mk(3, '35', '12')),\n      lift('Calf raise', '3 \u00d7 15 @ 40 kg', 'Last time: 3 \u00d7 15 @ 40 kg', mk(3, '40', '15')),\n      mv('stretch', 'Child\u2019s pose', '45 s', 'lower back'),\n      mv('stretch', 'Doorway chest stretch', '30 s each side', 'rounded shoulders'),\n      mv('stretch', 'Hamstring stretch', '30 s each side', ''),\n      mv('stretch', '90/90 hip stretch', '30 s each side', 'desk sitting')\n    ];\n    for (let i = 0; i < 4; i++) items[i].done = true;\n    items[4].sets[0].done = true;\n    items[4].sets[1].done = true;\n    this.secs = [\n      { id: 'warm', name: 'Warm-up', color: '#5AC8FA' },\n      { id: 'main', name: 'Main', color: null },\n      { id: 'stretch', name: 'Stretch', color: '#C3A6FF' }\n    ];\n    this.state = { items, cur: 4, list: false, confirm: false, elapsed: 14 * 60 + 5 };\n  }\n  componentDidMount() {\n    // Fixed demo time: 14:05. Timer paused for prototype review.\n  }\n  componentWillUnmount() { clearInterval(this.timer); }\n  edit(fn) {\n    const items = JSON.parse(JSON.stringify(this.state.items));\n    fn(items[this.state.cur]);\n    this.setState({ items });\n  }\n  renderVals() {\n    const accent = this.props.accent ?? '#FF7A3D';\n    const s = this.state;\n    const color = (sec) => this.secs.find((x) => x.id === sec).color || accent;\n    const secName = (sec) => this.secs.find((x) => x.id === sec).name;\n    const isDone = (it) => it.kind === 'move' ? it.done : it.sets.length > 0 && it.sets.every((x) => x.done);\n    const items = s.items;\n    const cur = items[s.cur];\n    const go = (i) => this.setState({ cur: i, list: false });\n\n    const present = this.secs.filter((sc) => items.some((it) => it.sec === sc.id));\n    const groups = present.map((sc) => {\n      const idxs = items.map((it, i) => i).filter((i) => items[i].sec === sc.id);\n      return {\n        flex: idxs.length,\n        segs: idxs.map((i) => ({\n          c: isDone(items[i]) || i === s.cur ? color(sc.id) : '#2E2F2A',\n          cls: i === s.cur && !isDone(items[i]) ? 'cur' : ''\n        }))\n      };\n    });\n    const inSec = items.map((it, i) => i).filter((i) => items[i].sec === cur.sec);\n    const posInSec = inSec.indexOf(s.cur) + 1;\n    const doneCount = items.filter(isDone).length;\n    const sectionStart = posInSec === 1;\n\n    const firstOpen = cur.kind === 'lift' ? cur.sets.findIndex((x) => !x.done) : -1;\n    const sets = cur.kind === 'lift' ? cur.sets.map((x, j) => ({\n      n: j + 1, kg: x.kg, reps: x.reps,\n      done: x.done ? 'true' : 'false',\n      label: x.done ? 'Set ' + (j + 1) + ' logged' : 'Log set ' + (j + 1),\n      rowBg: j === firstOpen ? '#1A1B17' : 'transparent',\n      fg: x.done ? '#A3A197' : '#F3F1EA',\n      btnBg: x.done ? accent : 'transparent',\n      btnBorder: x.done ? accent : '#3A3B35',\n      tick: x.done ? '#1A0E06' : '#6B6A62',\n      setKg: (ev) => { const v = ev.target.value; this.edit((c) => { c.sets[j].kg = v; }); },\n      setReps: (ev) => { const v = ev.target.value; this.edit((c) => { c.sets[j].reps = v; }); },\n      toggle: () => this.edit((c) => { c.sets[j].done = !x.done; }),\n      remove: () => this.edit((c) => { c.sets.splice(j, 1); })\n    })) : [];\n\n    const nextIdx = s.cur + 1;\n    const nxt = items[nextIdx];\n    const curDone = isDone(cur);\n    const allDone = doneCount === items.length;\n    const mainLeft = items.filter((it) => it.sec === 'main' && !isDone(it)).length;\n    const otherLeft = items.filter((it) => it.sec !== 'main' && !isDone(it)).length;\n    const parts = [];\n    if (mainLeft) parts.push(mainLeft + ' main exercise' + (mainLeft > 1 ? 's' : '') + ' not logged');\n    if (otherLeft) parts.push(otherLeft + ' warm-up/stretch move' + (otherLeft > 1 ? 's' : '') + ' unticked');\n\n    const listGroups = present.map((sc) => {\n      const idxs = items.map((it, i) => i).filter((i) => items[i].sec === sc.id);\n      return {\n        name: sc.name, color: color(sc.id),\n        count: idxs.filter((i) => isDone(items[i])).length + '/' + idxs.length,\n        items: idxs.map((i) => {\n          const it = items[i];\n          const d = isDone(it);\n          const here = i === s.cur;\n          return {\n            name: it.name,\n            meta: it.kind === 'lift' ? it.sets.filter((x) => x.done).length + '/' + it.sets.length + ' sets' : it.dose,\n            done: d,\n            ring: d || here ? color(sc.id) : '#3A3B35',\n            dot: d ? color(sc.id) : 'transparent',\n            bg: here ? '#26271F' : 'transparent',\n            fg: d && !here ? '#A3A197' : '#F3F1EA',\n            weight: here ? 700 : 500,\n            go: () => go(i)\n          };\n        })\n      };\n    });\n\n    const m = Math.floor(s.elapsed / 60), const instances={},forms={},templates={},root=document.getElementById('screen');let current='',rendering=false;const session={active:false,selected:'d3'};const detailContext={from:'Ph1Plan.dc.html',tab:'Ph1Plan.dc.html',workout:false};
class DCLogic{constructor(props){this.props=props;this.state={}}setState(update){const next=typeof update==='function'?update(this.state,this.props):update;if(current==='Ph1Plan.dc.html'&&session.active&&next.order&&next.order!==this.state.order){warnReset(()=>{resetSession();this.setState(next)});return;}Object.assign(this.state,next);if(!rendering&&!document.activeElement?.matches('input,textarea,select'))render()}}
function val(expr,scope){try{return Function('v','with(v){return ('+expr+')}')(scope)}catch(e){console.warn(expr,e);return ''}}
function interpolate(s,scope){return s.replace(/{{(.*?)}}/g,(_,e)=>{let v=val(e,scope);return v==null?'':String(v)})}
function node(n,scope){if(n.nodeType===3)return document.createTextNode(interpolate(n.textContent,scope));if(n.nodeType!==1)return document.createDocumentFragment();let tag=n.tagName.toLowerCase();if(tag==='helmet'){return document.createDocumentFragment()}if(tag==='sc-if'){let f=document.createDocumentFragment();if(val(n.getAttribute('value').replace(/^{{|}}$/g,''),scope))for(let c of n.childNodes)f.append(node(c,scope));return f}if(tag==='sc-for'){let f=document.createDocumentFragment(),list=val(n.getAttribute('list').replace(/^{{|}}$/g,''),scope)||[];list.forEach((item,index)=>{let s={...scope,[n.getAttribute('as')||'item']:item,$index:index};for(let c of n.childNodes)f.append(node(c,s))});return f}let e=n.namespaceURI==='http://www.w3.org/2000/svg'?document.createElementNS(n.namespaceURI,n.tagName):document.createElement(tag);for(let a of n.attributes){if(a.name.startsWith('hint-'))continue;if(/^on/i.test(a.name)){let handler=val(a.value.replace(/^{{|}}$/g,''),scope);if(typeof handler==='function'&&a.name.toLowerCase()==='onchange')e.dataset.bound='true';if(typeof handler==='function')e.addEventListener(a.name.slice(2).toLowerCase(),handler);continue}let value=interpolate(a.value,scope);if(a.name==='checked'||a.name==='disabled'){if(value==='true'||value==='')e.setAttribute(a.name,'');continue}e.setAttribute(a.name,value)}for(let c of n.childNodes)e.append(node(c,scope));return e}
function remember(){if(!current)return;forms[current]=Array.from(root.querySelectorAll('input:not([data-bound])')).map(e=>({value:e.value,checked:e.checked}));}
function render(){if(!current)return;rendering=true;remember();let scrolls=Array.from(root.querySelectorAll('*')).filter(e=>e.scrollTop).map(e=>[e.getAttribute('data-scroll-key'),e.scrollTop]);let spec=SCREENS[current],instance=instances[current],vals=instance.renderVals();if(current==='Ph1Today.dc.html'&&session.active){vals.cta='Resume workout';}if(current==='Ph1QuickStart.dc.html'){instance.state.pick=session.selected;vals=instance.renderVals();}if(current==='Ph1Exercise.dc.html'){vals.showBrowseNav=!detailContext.workout;vals.backHref=detailContext.from;vals.backLabel=detailContext.workout?'Back to Workout':'Back';vals.fromPicker=false;}if(current==='Ph1PlanExercise.dc.html')vals.showBrowseNav=true;root.replaceChildren();let fragment=templates[current];for(let child of fragment.childNodes)root.append(node(child,vals));Array.from(root.querySelectorAll('input:not([data-bound])')).forEach((e,i)=>{if(forms[current]?.[i]){e.value=forms[current][i].value;if(e.type==='checkbox')e.checked=forms[current][i].checked}e.addEventListener('input',remember)});root.querySelectorAll('*').forEach((e,i)=>e.setAttribute('data-scroll-key',i));for(let [key,y]of scrolls)root.querySelector('[data-scroll-key="'+key+'"]')?.scrollTo(0,y);rendering=false;decorateSession();}
function go(name){name=name.replace('Ph1Picker.dc.html','Ph1Plan.dc.html').split('?')[0].split('#')[0].split('/').pop();if(!SCREENS[name])return;if(name==='Ph1Exercise.dc.html'&&current!==name){detailContext.from=current;detailContext.workout=current==='Ph1Workout.dc.html'||current==='Ph1WorkoutList.dc.html';detailContext.tab=current==='Ph1History.dc.html'?'Ph1Progress.dc.html':current==='Ph1Plan.dc.html'||current==='Ph1PlanExercise.dc.html'?'Ph1Plan.dc.html':current==='Ph1Profile.dc.html'?'Ph1Profile.dc.html':'Ph1Today.dc.html';}remember();instances[current]?.componentWillUnmount?.();root.replaceChildren();current=name;if(!instances[name]){let spec=SCREENS[name],props={};for(let [k,v]of Object.entries(spec.props))props[k]=v.default;let C=Function('DCLogic',spec.code+';return Component')(DCLogic);instances[name]=new C(props);let t=document.createElement('template');t.innerHTML=spec.template;for(let h of t.content.querySelectorAll('helmet')){for(let e of h.children)document.head.append(e.cloneNode(true));h.remove()}templates[name]=t.content;}if(name==='Ph1Workout.dc.html'&&!session.active){prepareWorkout();session.active=true;}if(name==='Ph1Complete.dc.html'){session.active=false;delete instances['Ph1Workout.dc.html'];}render();instances[name]?.componentDidMount?.();}
root.addEventListener('focusout',()=>setTimeout(()=>render(),0));
root.addEventListener('click',e=>{let a=e.target.closest('a');if(!a)return;let target=a.getAttribute('href')||'';if(a.dataset.changeWorkout&&session.active){e.preventDefault();warnReset(()=>{resetSession();go(target)});return;}if(target.includes('Ph1Picker.dc.html')||SCREENS[target.split('?')[0].split('#')[0].split('/').pop()]){e.preventDefault();go(target)}});

function resetSession(){session.active=false;delete instances['Ph1Workout.dc.html'];delete forms['Ph1Workout.dc.html'];}
function planDays(){if(instances['Ph1Plan.dc.html'])return instances['Ph1Plan.dc.html'].state.order;const C=Function('DCLogic',SCREENS['Ph1Plan.dc.html'].code+';return Component')(DCLogic);return new C({}).recommended;}
function prepareWorkout(){const w=instances['Ph1Workout.dc.html'];const day=planDays().find(d=>d.id===session.selected)||planDays().find(d=>!d.rest);w.state.items=day.sections.flatMap(sc=>sc.ex.map(ex=>{let sec=sc.name==='Main'?'main':sc.name==='Warm-up'?'warm':'stretch';let match=ex.target.match(/(\d+)\s*[×x]\s*(\d+)(?:\s*@\s*([\d.]+))?/);return sec==='main'?{sec,kind:'lift',name:ex.name,target:ex.target,last:'No sets logged yet',sets:Array.from({length:match?+match[1]:3},()=>({kg:match?.[3]||'',reps:match?.[2]||'10',done:false}))}:{sec,kind:'move',name:ex.name,dose:ex.target,tag:'',done:false}}));w.state.cur=0;w.state.elapsed=14*60+5;w.state.list=false;w.state.confirm=false;}
function warnReset(accept){if(document.getElementById('reset-warning'))return;const overlay=document.createElement('div');overlay.id='reset-warning';overlay.style='position:absolute;inset:0;z-index:100;background:#000b;display:flex;align-items:flex-end;padding:16px';overlay.innerHTML='<section role="dialog" aria-modal="true" aria-labelledby="reset-title" style="width:100%;background:#1E1F1B;border:1px solid #3A3B35;border-radius:20px;padding:24px;font-family:Barlow,Arial,sans-serif"><h2 id="reset-title" style="margin:0 0 12px">Reset current workout?</h2><p style="color:#C9C7BE;line-height:1.5">A workout is already in progress. Changing the workout will clear all sets and exercises logged in this session. Today’s current workout progress will return to zero.</p><p style="color:#A3A197;font-size:14px">Completed workout history will stay saved.</p><button id="keep-session" style="width:100%;min-height:48px;background:#FF7A3D;color:#1A0E06;border:0;border-radius:12px;font-weight:700">Keep current workout</button><button id="discard-session" style="width:100%;min-height:48px;margin-top:8px;border:1px solid #3A3B35;background:transparent;color:#F3F1EA;border-radius:12px">Reset progress and change</button></section>';document.getElementById('phone').append(overlay);const previous=document.activeElement;const close=()=>{overlay.remove();previous?.focus()};overlay.querySelector('#keep-session').onclick=close;overlay.querySelector('#discard-session').onclick=()=>{overlay.remove();accept()};overlay.addEventListener('keydown',e=>{if(e.key==='Escape'){close();return;}if(e.key==='Tab'){e.preventDefault();const buttons=overlay.querySelectorAll('button');(document.activeElement===buttons[0]?buttons[1]:buttons[0]).focus()}});overlay.querySelector('button').focus();}
function decorateSession(){if(current==='Ph1Exercise.dc.html'||current==='Ph1PlanExercise.dc.html'){const active=current==='Ph1PlanExercise.dc.html'?'Ph1Plan.dc.html':detailContext.tab;for(const a of root.querySelectorAll('nav a')){if(a.getAttribute('href')===active){a.setAttribute('aria-current','page');a.style.color='#FF7A3D';}else a.removeAttribute('aria-current');}}for(const a of root.querySelectorAll('a[href="Ph1QuickStart.dc.html"]')){a.setAttribute('aria-label',session.active?'Resume workout':'Start a workout');for(const n of a.childNodes)if(n.nodeType===3&&n.textContent.trim())n.textContent=session.active?'Resume':'Start';}if(current==='Ph1Workout.dc.html'){const timer=root.querySelector('[role="timer"]');const label=timer?.previousElementSibling;const day=planDays().find(d=>d.id===session.selected);if(label&&day)label.textContent=day.focus;}}
root.addEventListener('click',e=>{const b=e.target.closest('[data-workout-id]');if(!b)return;const id=b.dataset.workoutId;if(session.active&&id===session.selected){go('Ph1Workout.dc.html');return;}const change=()=>{resetSession();session.selected=id;go('Ph1QuickStart.dc.html')};if(session.active)warnReset(change);else change();});
go('Ph1Welcome.dc.html');
